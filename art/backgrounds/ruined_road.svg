<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0b13"/>
      <stop offset="0.38" stop-color="#261c2a"/>
      <stop offset="0.56" stop-color="#46302f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8c890" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8c890" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f1f"/>
      <stop offset="0.4" stop-color="#140f0f"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d302b"/>
      <stop offset="1" stop-color="#211816"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1480" cy="200" r="300" fill="url(#glow)"/>
  <circle cx="1480" cy="200" r="62" fill="#e6d6b4" opacity="0.85"/>
  <circle cx="1500" cy="186" r="58" fill="#261c2a" opacity="0.35"/>

  <g transform="translate(0,-110)">
    <!-- distant hills -->
    <path d="M0 640 Q180 560 400 610 Q620 530 880 600 Q1130 520 1380 596 Q1640 540 1920 610 L1920 780 L0 780 Z" fill="#221922"/>
    <!-- ruined arches, left -->
    <g fill="#17111a">
      <rect x="150" y="430" width="56" height="320"/>
      <rect x="330" y="470" width="56" height="280"/>
      <path d="M150 440 Q268 330 386 480 L386 520 Q268 400 206 470 Z"/>
      <rect x="470" y="560" width="44" height="190"/>
      <path d="M470 560 L500 520 L514 548 L514 600 L470 600 Z"/>
    </g>
    <!-- ruined arches and a dead tree, right -->
    <g fill="#17111a">
      <rect x="1440" y="480" width="52" height="270"/>
      <path d="M1440 490 Q1530 410 1600 470 L1590 500 Q1530 450 1492 510 Z"/>
      <rect x="1700" y="400" width="60" height="350"/>
      <path d="M1700 400 L1716 360 L1734 392 L1748 370 L1760 400 Z"/>
      <path d="M1250 760 L1262 560 Q1230 520 1196 500 L1204 492 Q1240 510 1264 536 L1270 470 Q1250 440 1226 430 L1232 422 Q1260 430 1274 452 L1282 420 L1290 424 L1284 470 Q1310 450 1340 446 L1342 454 Q1310 462 1288 490 L1286 760 Z"/>
    </g>
  </g>

  <!-- ground and the road the fight takes place on (feet at y 680) -->
  <rect y="628" width="1920" height="452" fill="url(#ground)"/>
  <path d="M0 652 Q960 630 1920 652 L1920 770 Q960 752 0 770 Z" fill="url(#road)"/>
  <g fill="#4a3a31" opacity="0.7">
    <ellipse cx="120" cy="695" rx="40" ry="9"/><ellipse cx="300" cy="725" rx="52" ry="11"/>
    <ellipse cx="520" cy="684" rx="36" ry="8"/><ellipse cx="700" cy="735" rx="46" ry="10"/>
    <ellipse cx="900" cy="692" rx="40" ry="8"/><ellipse cx="1080" cy="732" rx="50" ry="11"/>
    <ellipse cx="1260" cy="690" rx="38" ry="8"/><ellipse cx="1440" cy="728" rx="46" ry="10"/>
    <ellipse cx="1640" cy="694" rx="42" ry="9"/><ellipse cx="1820" cy="724" rx="48" ry="10"/>
  </g>

  <!-- foreground grass and posts in the bottom corners of the stage -->
  <g fill="#090707" transform="translate(0,-250)">
    <path d="M0 1080 L0 960 Q40 930 60 980 Q80 920 110 970 Q130 940 160 990 Q200 950 230 1000 L260 1080 Z"/>
    <path d="M1920 1080 L1920 950 Q1880 920 1860 975 Q1840 915 1810 965 Q1790 935 1760 985 Q1720 945 1690 1000 L1660 1080 Z"/>
    <rect x="70" y="900" width="18" height="180"/><rect x="1830" y="890" width="18" height="190"/>
    <path d="M60 920 L98 900 L98 914 L60 934 Z M1820 910 L1858 890 L1858 904 L1820 924 Z"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
