  <rect x="1.5" y="1.5" width="93" height="93" fill="url(#fill)" stroke="#060404" stroke-width="3"/>
  <rect x="5" y="5" width="86" height="86" fill="none" stroke="#6e5232" stroke-width="2"/>
  <rect x="9" y="9" width="78" height="78" fill="none" stroke="#3a2a1c" stroke-width="1"/>
